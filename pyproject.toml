[project]
name = "nets"
version = "0.1.0"
description = "Passives und aktives Netzwerk-Inventar mit Layer-2-Topologie"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.scripts]
nets = "nets.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nets*"]

[tool.setuptools.package-data]
nets = ["web/static/*", "data/*"]
